<!DOCTYPE html> <html> <head> <title>Furniture System</title> <style> body { margin: 0; font-family: 'Poppins', Arial; display: flex; background: linear-gradient(to right, #ffffff, #f3e5d8); } /* 🪑 SIDEBAR */ .sidebar { width: 230px; background: #1a1a1a; /* black */ color: white; height: 100vh; position: fixed; animation: slideLeft 0.7s ease-in-out; } .sidebar h2 { text-align: center; padding: 15px; border-bottom: 1px solid #2b1d0e; color: #f3e5d8; font-family: 'Playfair Display', serif; } .sidebar a { display: block; color: white; padding: 12px; text-decoration: none; transition: 0.3s; } .sidebar a:hover { background: #2b1d0e; /* brown hover */ transform: translateX(5px); } /* 🪑 CONTENT */ .content { margin-left: 230px; width: 100%; padding: 20px; animation: fadeIn 1s ease-in-out; } /* 🪑 ANIMATION */ @keyframes fadeIn { from {opacity: 0;} to {opacity: 1;} } @keyframes slideLeft { from {transform: translateX(-100%);} to {transform: translateX(0);} } </style> </head> <body> <div class="sidebar"> <h2>🪑 Furniture</h2> <a href="{% url 'admin_page' %}">Dashboard</a> <a href="/add-plant/">Add Furniture</a> <a href="{% url 'view_all_plants' %}">View Furniture</a> <a href="{% url 'admin_manage_orders' %}">Manage Orders</a> <a href="{% url 'logout' %}">Logout</a> </div> <!-- 🪑 CONTENT --> <div class="content"> {% block content %} {% endblock %} </div> </body> </html>
