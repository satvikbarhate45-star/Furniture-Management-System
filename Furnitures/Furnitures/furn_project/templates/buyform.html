{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Buy Furniture | Furniture Management System</title>

    <style>
        body {
            font-family: 'Georgia', serif;
            background: #f5f5f5;
            padding-top: 80px;
        }

        .container {
            width: 500px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 12px rgba(43,27,20,0.25);
        }

        h2 {
            color: #2b1b14;
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
            color: #2b1b14;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #5a3e2b;
            box-shadow: 0 0 5px rgba(90,62,43,0.3);
        }

        button {
            margin-top: 15px;
            width: 100%;
            padding: 10px;
            background: #2b1b14;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            background: #5a3e2b;
            transform: scale(1.02);
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Buy Furniture: {{ plant.name }}</h2>

    <form method="POST">
        {% csrf_token %}

        <label>First Name</label>
        <input type="text" name="first_name" value="{{ request.user.first_name }}" required>

        <label>Last Name</label>
        <input type="text" name="last_name" value="{{ request.user.last_name }}" required>

        <label>Contact No</label>
        <input type="text" name="contact" placeholder="Enter contact number" required>

        <label>Address</label>
        <input type="text" name="address" placeholder="Street address" required>

        <label>State</label>
        <input type="text" name="state" placeholder="State" required>

        <label>District</label>
        <input type="text" name="district" placeholder="District" required>

        <label>Location</label>
        <input type="text" name="location" placeholder="Location" required>

        <label>Pincode</label>
        <input type="text" name="pincode" placeholder="Pincode" required>

        <label>Quantity</label>
        <input type="number" name="quantity" value="1" min="1" max="{{ plant.quantity_available }}" required>

        <label>Payment Method</label>
        <select name="pay_method" required>
            <option value="offline">Cash on Delivery</option>
            <option value="online">Online Payment</option>
        </select>

        <button type="submit">Place Order</button>
    </form>
</div>

</body>
</html>
