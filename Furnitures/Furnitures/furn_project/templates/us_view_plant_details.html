{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>{{ plant.name }} - Green Nursery</title>
    <style>
        body {font-family: Arial; background:#f4fff4; padding:80px 20px;}
        .container {max-width:900px; margin:auto; background:white; padding:20px; border-radius:10px; box-shadow:0 0 15px rgba(0,128,0,0.2);}
        .plant-details {display:flex; flex-wrap:wrap; gap:20px; align-items:flex-start;}
        .plant-details img {width:100%; max-width:400px; height:auto; border-radius:10px; border-bottom:4px solid green;}
        .plant-info {flex:1;}
        .plant-info h2 {color:green; margin-bottom:10px;}
        .plant-info p {margin:5px 0; font-size:16px;}
        .plant-info button {margin:10px 5px 0 0; padding:10px 15px; border:none; border-radius:5px; cursor:pointer;}
        .plant-info button.add {background:green; color:white;}
        .plant-info button.buy {background:orange; color:white;}
        @media screen and (max-width:768px){
            .plant-details {flex-direction:column; align-items:center;}
            .plant-info {width:100%;}
        }
    </style>
</head>
<body>

{% include 'header.html' %}

<div class="container">
    <div class="plant-details">
        <!-- Plant Image -->
        <img src="{{ plant.image.url }}" alt="{{ plant.name }}">

        <!-- Plant Info -->
        <div class="plant-info">
            <h2>{{ plant.name }}</h2>
            <p><strong>Type:</strong> {{ plant.plant_type }}</p>
            <p><strong>Quality:</strong> {{ plant.quality }}</p>
            <p><strong>Growth:</strong> {{ plant.growth }}</p>
            <p><strong>Available Quantity:</strong> {{ plant.quantity }}</p>
            <p><strong>Price:</strong> ₹{{ plant.price }}</p>

            <!-- Add to Cart -->
            <form action="{% url 'add_to_cart' plant.id %}" method="post" style="display:inline;">
                {% csrf_token %}
                <button type="submit" class="add">Add to Cart</button>
            </form>

            <!-- Buy Now -->
            <button class="buy" onclick="alert('Proceed to buy {{ plant.name }}')">Buy Now</button>
        </div>
    </div>
</div>

</body>
</html>
