{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Edit Order</title>

    <style>
        /* 🪑 GLOBAL */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5efe7;
            margin: 0;
            padding: 0;
        }

        h2 {
            text-align: center;
            color: #2b1d0e;
            margin: 40px 0 20px 0;
            font-family: 'Playfair Display', serif;
        }

        /* 🪑 FORM BOX */
        .form-container {
            width: 90%;
            max-width: 600px;
            margin: 0 auto 50px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(43,29,14,0.2);
            border-top: 4px solid #2b1d0e;
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            0% {opacity:0; transform: translateY(-20px);}
            100% {opacity:1; transform: translateY(0);}
        }

        /* 🪑 LABEL */
        label {
            display: block;
            margin: 12px 0 6px 0;
            font-weight: bold;
            color: #2b1d0e;
        }

        /* 🪑 INPUTS */
        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            transition: 0.3s;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #2b1d0e;
            box-shadow: 0 0 6px rgba(43,29,14,0.3);
        }

        /* 🪑 BUTTON */
        button {
            margin-top: 20px;
            padding: 12px;
            width: 100%;
            background: #2b1d0e;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #000000;
            transform: scale(1.03);
        }

        /* 🪑 RESPONSIVE */
        @media(max-width: 480px) {
            .form-container {
                padding: 20px;
            }

            h2 {
                font-size: 20px;
            }

            button {
                font-size: 14px;
                padding: 10px;
            }
        }
    </style>
</head>

<body>

    <h2>🪑 Edit Furniture Order: {{ booking.plant.name }}</h2>

    <div class="form-container">
        <form method="POST">
            {% csrf_token %}

            <label>First Name</label>
            <input type="text" name="first_name" value="{{ booking.first_name }}" required>

            <label>Last Name</label>
            <input type="text" name="last_name" value="{{ booking.last_name }}" required>

            <label>Contact</label>
            <input type="text" name="contact" value="{{ booking.contact }}" required>

            <label>Address</label>
            <input type="text" name="address" value="{{ booking.address }}" required>

            <label>State</label>
            <input type="text" name="state" value="{{ booking.state }}">

            <label>District</label>
            <input type="text" name="district" value="{{ booking.district }}">

            <label>Location</label>
            <input type="text" name="location" value="{{ booking.location }}">

            <label>Pincode</label>
            <input type="text" name="pincode" value="{{ booking.pincode }}">

            <label>Quantity</label>
            <input type="number" name="quantity" value="{{ booking.quantity }}" min="1" required>

            <label>Payment Method</label>
            <select name="pay_method">
                <option value="online" {% if booking.pay_method == 'online' %}selected{% endif %}>
                    Online
                </option>
                <option value="offline" {% if booking.pay_method == 'offline' %}selected{% endif %}>
                    Cash on Delivery
                </option>
            </select>

            <button type="submit">Update Order</button>
        </form>
    </div>

</body>
</html>
