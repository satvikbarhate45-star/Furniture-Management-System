{% load static %}

<!DOCTYPE html>
<html>
<head>
<title>Nursery Plants</title>

<style>

/* 🌿 GLOBAL */
body {
    margin:0;
    font-family: Arial;
    background:#f4fff4;
    padding-top:80px;
}

/* 🌿 PLANT CARDS */
.section {
    padding:40px;
    text-align:center;
}

.cards {
    display:flex;
    gap:20px;
    flex-wrap:wrap;
    justify-content:center;
}

.card {
    width:220px;
    background:white;
    border-radius:10px;
    box-shadow:0 0 15px rgba(0,128,0,0.2);
    overflow:hidden;
    transition:0.3s;
    animation:fadeInUp 1s;
}

.card:hover {
    transform:translateY(-8px);
}

.card img {
    width:100%;
    height:180px;
    object-fit:cover;
    border-bottom:4px solid green;
}

.card h3 {
    color:green;
    margin:10px 0;
}

.card p {
    margin:5px;
}

.card button {
    margin:5px;
    padding:6px 10px;
    background:green;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    width:100px;
}

.card .btn-group {
    display:flex;
    justify-content:space-around;
}

/* 🌿 ANIMATION */
@keyframes fadeInUp {
    from {opacity:0; transform:translateY(30px);}
    to {opacity:1; transform:translateY(0);}
}

</style>
</head>

<body>

{% include 'header.html' %}

<!-- 🌿 PLANT CARDS -->
<div class="section">
    <h2>🌱 Available Plants</h2>

    <div class="cards">
        {% for plant in plants %}
        <div class="card">
            <img src="{{ plant.image.url }}" alt="{{ plant.name }}">
            <h3>{{ plant.name }}</h3>
            <p style="font-weight: bold; color: yesno;">Quality: {{ plant.quality }}</p>
            <p style="font-weight: bold; color: green;">Type: {{ plant.plant_type }}</p>
            <p style="font-weight: bold; color: #a33636;">Price: ₹{{ plant.price }}</p>
            <div class="btn-group">
                <a href="{% url 'buy_plant' plant.id %}">
        <button type="button">Buy</button>
    </a>

                <a href="{% url 'plant_detail' plant.id %}" style="background:#cf7f7f; padding:8px 12px; color:white; text-decoration:none; border-radius:5px;">
    View Details
</a>
            </div>
        </div>
        {% endfor %}
    </div>
</div>


</body>
</html>
